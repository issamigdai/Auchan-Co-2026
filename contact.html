<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>auchan</title>
</head>

<body class="bg-[#f7f7f7]">
    <header>
        <div class="flex flex-row bg-[#f7f7f7] w-full justify-between px-[10px]">
            <button class="flex flex-row items-center gap-1 cursor-pointer hover:border rounded-lg">
                <img src="icons/car-side-svgrepo-com.png" alt="caricon" class="h-[40px]">
                <strong>
                    Withdrawal:
                </strong>
                <span class="font-light italic underline">
                    Auchan Drive Supermarket Le Perray-En-Yvelines
                </span>
                <img src="icons/arrow-next-small-svgrepo-com.png" alt="arrow" class="h-[20px]">
            </button>
            <button class="flex flex-row items-center gap-2 cursor-pointer hover:border rounded-lg">
                <img src="icons/profile-svgrepo-com.png" alt="profile" class="h-[30px]">
                <span class="font-light italic underline">Me connect</span>
            </button>
        </div>
    </header>
    <nav class="flex flex-row items-center justify-between py-4 bg-white px-[20px] sticky top-0 z-50 gap-4 shadow">

        <div class="flex flex-row items-center gap-6">
            <a href="#"
                class="hover:text-red-800 inline-block transition-transform duration-200 hover:-translate-y-1">Categorie</a>
            <a href="#"
                class="hover:text-red-800 inline-block transition-transform duration-200 hover:-translate-y-1">Catalogue</a>
            <a href="#"
                class="hover:text-red-800 inline-block transition-transform duration-200 hover:-translate-y-1">Contact</a>

    <main class="flex flex-col bg-[#F8FAFC] px-16 py-8 gap-8">
        <small>Home / Contact</small>
        <div class="flex flex-col gap-2">
            <small class="py-1 px-2 w-19 rounded-2xl bg-[#FEF2F2] text-[#DC2626]">
                LETS TALK
            </small>
            <h1 class="font-bold font-sans text-4xl">A little help goes a long way.</h1>
            <small class="font-sans font-light">Your local AUCHAN team is here for you, online and in store.</small>
        </div>
        <div>
        </div>
    </main>
    <footer class="bg-white">
        <div class="flex flex-col gap-2 p-8 ">
            <strong>© 2026 AUCHAN Shopping Centre</strong>
            <small>Everyday essentials. Local support. All prices in DH.</small>
        </div>
